name: Build ESP32 Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: 'false'

      - name: Build Firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py build
